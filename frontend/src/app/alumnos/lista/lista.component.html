<div class="container mt-4">
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="mb-0">Lista de Alumnos</h3>
      <button class="btn btn-success btn-sm" routerLink="/menu/alumnos/formulario">Alta</button>
    </div>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Folio</th>
          <th>Nombre</th>
          <th>Apellido Paterno</th>
          <th>Apellido Materno</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let alumno of alumnos; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ alumno.nombre }}</td>
          <td>{{ alumno.apellidoPaterno }}</td>
          <td>{{ alumno.apellidoMaterno }}</td>
          <td>
            <button class="btn btn-warning btn-sm"
              [routerLink]="['/menu/alumnos/formulario', alumno.idAlumno]">Editar</button>
          </td>
          <td>
            <button class="btn btn-danger btn-sm" (click)="borrarAlumno(alumno.idAlumno)">Baja</button>
          </td>
          <td>
            <button class="btn btn-primary  btn-sm"
              [routerLink]="['/menu/alumnos/informacion', alumno.idAlumno]">Consultar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
