<div class="row justify-content-center">
  <h3 class="text-center">Registrar Materia</h3>
  <div class="col-md-4">
    <div class="form-group mb-3">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" [(ngModel)]="nombre" name="nombre" ngModel="nombre" name="nombre"
        class="form-control" style="text-transform: uppercase;" placeholder="Nombre Materia"
        (keypress)="soloLetras($event)">
    </div>
    <div class="form-group mb-3">
      <label for="costoMateria">Costo</label>
      <input type="text" id="costoMateria" [(ngModel)]="costoMateria" name="costoMateria" name="costoMateria"
        style="text-transform: uppercase;" class="form-control" placeholder="Costo de la materia"
        (keypress)="soloNumeros($event)">
    </div>
    <div class="col-md-1 d-flex gap-2">
      <button type="button" class="btn btn-success btn-sm" (click)="guardarMateria()">Guardar</button>
      <button type="button" class="btn btn-danger btn-sm" (click)="limpiarMateria()">Cancelar</button>
      <button type="button" class="btn btn-link btn-sm" routerLink="/menu/materias/lista">Volver</button>
    </div>
  </div>
</div>
